<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armá tu presupuesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--k:#6b0032;--p:#f3f1e7;--b:#8a0149;--y:#e6ceb3;--r:#a84d51;--bd:3px solid var(--k);--sh:6px 6px 0 var(--k);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--p);color:var(--k);font:16px/1.5 "Space Mono",ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden;
background-image:linear-gradient(#6b00321f 1px,transparent 1px),linear-gradient(90deg,#6b00321f 1px,transparent 1px);background-size:44px 44px}
.d{font-family:"Archivo Black","Arial Black",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.02em;line-height:.95}
.top{display:flex;justify-content:space-between;background:var(--k);color:var(--p);border-bottom:var(--bd)}
.top b{padding:12px 16px;text-decoration:none;color:inherit}
.top a{background:var(--r);color:#fff;text-decoration:none;padding:12px 16px;font-weight:700;font-size:.85rem;display:flex;align-items:center}
.top a:hover{background:var(--y);color:var(--k)}
.w{max-width:1080px;margin:0 auto;padding:30px 18px 56px}
h1{margin:0 0 12px;font-size:clamp(1.8rem,8.6vw,4.6rem)}
h1 .hl{white-space:nowrap;background:var(--y);padding:0 .12em;border:var(--bd);box-shadow:var(--sh);display:inline-block;transform:rotate(-1.5deg)}
.sub{margin:18px 0 22px;max-width:36em}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
input,select{font:inherit;color:var(--k);background:#fff;border:var(--bd);padding:11px 12px;border-radius:0;box-shadow:4px 4px 0 var(--k)}
input:focus-visible,select:focus-visible{outline:3px solid var(--b);outline-offset:2px}
#q{flex:1;min-width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
.pc{background:var(--p);border:var(--bd);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:8px}
.pc:nth-child(even){background:var(--y)}
.pc.off{opacity:.7}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tag{background:var(--k);color:var(--y);font-size:.72rem;font-weight:700;padding:3px 8px;letter-spacing:.05em;text-transform:uppercase}
.ic{font-size:2rem;line-height:1;background:#fff;border:var(--bd);padding:6px 8px}
.pc h3{margin:6px 0 0;font-size:1.35rem}
.price{font-size:1.9rem}
.st{align-self:flex-start;font-size:.78rem;font-weight:700;padding:3px 9px;border:2px solid var(--k);text-transform:uppercase;letter-spacing:.04em}
.st.ok{background:var(--k);color:var(--y)}
.st.lo{background:var(--r);color:#fff}
.st.no{background:#fff;border-style:dashed}
.btn{font:inherit;font-weight:700;text-transform:uppercase;cursor:pointer;background:var(--b);color:#fff;border:var(--bd);box-shadow:4px 4px 0 var(--k);padding:11px 14px;transition:transform .12s,box-shadow .12s,background .12s}
.btn:hover:not(:disabled),.btn:focus-visible:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--k);background:var(--r)}
.btn:focus-visible{outline:3px solid var(--k);outline-offset:3px}
.btn:disabled{background:var(--p);color:var(--k);opacity:.45;cursor:not-allowed;box-shadow:none}
.pc .btn{margin-top:auto}
.sm{padding:2px 11px;background:var(--p);color:var(--k);box-shadow:2px 2px 0 var(--k)}
.none{grid-column:1/-1;font-weight:700}

#cart{margin-top:44px;background:var(--y);border:var(--bd);box-shadow:8px 8px 0 var(--k);padding:20px}
#cart h2{margin:0 0 14px;font-size:clamp(1.6rem,6vw,2.6rem)}
.l{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 0;border-bottom:2px dashed var(--k)}
.l .nm{flex:1 1 140px;font-weight:700}
.l .pr{min-width:84px;text-align:right;font-weight:700}
.empty{margin:0 0 6px}
.t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0}
.t span:first-child{font-size:1.1rem}
.t span:last-child{font-size:clamp(1.8rem,7vw,2.8rem)}
.f{display:grid;gap:12px}
#send{width:100%;font-family:"Archivo Black","Arial Black",Impact,sans-serif;font-size:1.1rem;padding:16px}
.note{margin:16px 0 0;font-size:.8rem}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>

<header class="top">
<b class="d">Anat Producciones</b>
<a href="index.html">← INICIO</a>
</header>

<main class="w">
<h1 class="d">Armá tu<br><span class="hl">presupuesto.</span></h1>
<p class="sub">Elegí tus productos, mirá la disponibilidad y enviá tu presupuesto estimado.</p>

<div class="bar">
<input id="q" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
<select id="cat" aria-label="Categoría"><option value="">Todas las categorías</option></select>
</div>

<div class="grid" id="g"></div>

<section id="cart">
<h2 class="d">Tu presupuesto</h2>
<div id="items"></div>
<div class="t"><span class="d">Total estimado</span><span class="d" id="tot">$0</span></div>
<div class="f">
<input id="nom" placeholder="Tu nombre">
<input id="nota" placeholder="Notas (entrega, horario, etc.)">
<button class="btn" id="send" disabled>Enviar por WhatsApp →</button>
</div>
<p class="note">Los valores son estimados y se confirman al coordinar el pedido.</p>
</section>
</main>

<script>
// ====== EDITÁ ESTO ======
const WHATSAPP = "5491124998923"; // tu número con código de país, sin + ni espacios
const MONEDA = "$";
const PRODUCTOS = [
 {id:1,nombre:"Producto de ejemplo 1",cat:"Categoría A",precio:12500,stock:20,icono:"📦"},
 {id:2,nombre:"Producto de ejemplo 2",cat:"Categoría A",precio:8900,stock:3,icono:"🎁"},
 {id:3,nombre:"Producto de ejemplo 3",cat:"Categoría B",precio:15200,stock:0,icono:"🛍️"},
 {id:4,nombre:"Producto de ejemplo 4",cat:"Categoría B",precio:4300,stock:50,icono:"🧴"}
];
// ========================
const $=s=>document.querySelector(s);
const fmt=n=>MONEDA+n.toLocaleString("es-AR");
const cart={};
[...new Set(PRODUCTOS.map(p=>p.cat))].forEach(c=>$("#cat").insertAdjacentHTML("beforeend",`<option>${c}</option>`));

function badge(p){
 if(p.stock<=0)return'<span class="st no">Agotado</span>';
 if(p.stock<=5)return`<span class="st lo">¡Últimas ${p.stock}!</span>`;
 return'<span class="st ok">Disponible</span>';
}
function render(){
 const q=$("#q").value.toLowerCase(),c=$("#cat").value;
 const list=PRODUCTOS.filter(p=>p.nombre.toLowerCase().includes(q)&&(!c||p.cat===c));
 $("#g").innerHTML=list.map(p=>`
 <article class="pc ${p.stock<=0?"off":""}">
  <div class="hd"><span class="tag">${p.cat}</span><span class="ic">${p.icono}</span></div>
  <h3 class="d">${p.nombre}</h3>
  <div class="price d">${fmt(p.precio)}</div>
  ${badge(p)}
  <button class="btn" ${p.stock<=0||(cart[p.id]||0)>=p.stock?"disabled":""} onclick="add(${p.id})">Agregar +</button>
 </article>`).join("")||'<p class="none">No hay productos que coincidan.</p>';
}
function add(id){cart[id]=(cart[id]||0)+1;draw()}
function sub(id){cart[id]--;if(cart[id]<=0)delete cart[id];draw()}
function draw(){
 render();
 const ids=Object.keys(cart);let total=0;
 $("#items").innerHTML=ids.length?ids.map(id=>{
  const p=PRODUCTOS.find(x=>x.id==id),q=cart[id];total+=p.precio*q;
  return`<div class="l"><span class="nm">${p.nombre}</span><button class="btn sm" aria-label="Quitar uno" onclick="sub(${id})">−</button><span>${q}</span><button class="btn sm" aria-label="Agregar uno" ${q>=p.stock?"disabled":""} onclick="add(${id})">+</button><span class="pr">${fmt(p.precio*q)}</span></div>`}).join(""):'<p class="empty">Todavía no agregaste productos.</p>';
 $("#tot").textContent=fmt(total);
 $("#send").disabled=!ids.length;
}
$("#send").onclick=()=>{
 let m="Hola, quiero este presupuesto:\n";let total=0;
 Object.keys(cart).forEach(id=>{const p=PRODUCTOS.find(x=>x.id==id);total+=p.precio*cart[id];m+=`• ${cart[id]} x ${p.nombre} — ${fmt(p.precio*cart[id])}\n`});
 m+=`\nTotal estimado: ${fmt(total)}`;
 if($("#nom").value)m+=`\nNombre: ${$("#nom").value}`;
 if($("#nota").value)m+=`\nNotas: ${$("#nota").value}`;
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(m),"_blank");
};
$("#q").oninput=render;$("#cat").onchange=render;
draw();
</script>
</body>
</html>
